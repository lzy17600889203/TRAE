<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>社区闲置交易</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">🧺 社区闲置</div>
    <nav class="tabs" id="tabs">
      <button data-view="list" class="tab active">商品广场</button>
      <button data-view="orders" class="tab">订单中心</button>
      <button data-view="mine" class="tab">我的发布</button>
    </nav>
    <div class="userbox">
      <label>当前用户</label>
      <select id="userSelect"></select>
      <button id="addUserBtn" class="btn ghost small">+新用户</button>
    </div>
  </header>

  <main class="container">
    <!-- 列表 -->
    <section id="view-list" class="view active">
      <div class="toolbar">
        <input id="search" type="search" placeholder="搜索 标题 / 描述 ..." />
        <select id="filterStatus">
          <option value="">全部状态</option>
          <option value="on_sale">在售</option>
          <option value="reserved">已预订</option>
          <option value="sold">已售出</option>
        </select>
        <button id="openPublishBtn" class="btn primary">发布闲置</button>
      </div>
      <div id="goodsList" class="goods-grid"></div>
      <div id="emptyList" class="empty" hidden>暂无商品，点右上角发布第一件闲置吧 🎁</div>
    </section>

    <!-- 订单 -->
    <section id="view-orders" class="view">
      <div class="toolbar">
        <div class="chip" data-role="seller">我收到的订单</div>
        <div class="chip active" data-role="buyer">我发起的订单</div>
      </div>
      <div id="ordersList" class="orders-list"></div>
      <div id="emptyOrders" class="empty" hidden>还没有订单~</div>
    </section>

    <!-- 我的 -->
    <section id="view-mine" class="view">
      <div class="toolbar">
        <h3 id="meTitle">我的闲置</h3>
        <button id="refreshMineBtn" class="btn ghost small">刷新</button>
      </div>
      <div id="mineList" class="goods-grid"></div>
      <div id="emptyMine" class="empty" hidden>你还没有发布过商品</div>
    </section>
  </main>

  <!-- 发布/编辑 Modal -->
  <div class="modal" id="publishModal" hidden>
    <div class="modal-card">
      <header class="modal-head">
        <h3 id="publishTitle">发布闲置</h3>
        <button class="btn ghost" type="button" data-close>×</button>
      </header>
      <div class="modal-body">
        <form id="publishForm" autocomplete="off">
          <div class="row">
            <label>标题 <small>*</small></label>
            <input name="title" required placeholder="如 iPhone 13 256G 自用" />
          </div>
          <div class="row">
            <label>描述</label>
            <textarea name="description" rows="3" placeholder="成色、使用时间、可议价空间..."></textarea>
          </div>
          <div class="row two-col">
            <div>
              <label>价格(元)</label>
              <input name="price" type="number" step="0.01" min="0" value="0" />
            </div>
            <div>
              <label>分类</label>
              <input name="category" placeholder="数码 / 家具 / 衣物..." />
            </div>
          </div>
          <div class="row">
            <label>所在地</label>
            <input name="location" placeholder="如 东苑 3 号楼" />
          </div>
          <div class="row">
            <label>图片（最多 9 张）</label>
            <input id="fileInput" type="file" accept="image/*" multiple />
            <div id="preview" class="preview"></div>
          </div>
        </form>
      </div>
      <footer class="modal-foot">
        <button class="btn ghost" type="button" data-close>取消</button>
        <button class="btn primary" type="button" id="submitBtn">提交发布</button>
      </footer>
    </div>
  </div>

  <!-- 商品详情 Modal -->
  <div class="modal" id="detailModal" hidden>
    <div class="modal-card wide">
      <header class="modal-head">
        <h3 id="detailTitle">商品详情</h3>
        <button class="btn ghost" type="button" data-close>×</button>
      </header>
      <div class="modal-body" id="detailBody">
        <div class="gallery" id="detailGallery"></div>
        <div class="meta" id="detailMeta"></div>
        <div class="actions" id="detailActions"></div>

        <div class="buy-row" id="buyRow" hidden>
          <label>给卖家的留言</label>
          <textarea id="buyMsg" rows="2" placeholder="可议价 / 方便交易的时间..."></textarea>
          <button class="btn primary" id="buyBtn">向 TA 发起购买请求</button>
        </div>

        <div class="comments">
          <h4>🗨 留言评论</h4>
          <div id="commentList" class="comment-list"></div>
          <form id="commentForm" class="comment-form">
            <input id="commentInput" placeholder="按 Enter 发送留言 / Shift+Enter 换行" />
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
