<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>宠物档案详情</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="/" class="back-link">← 返回</a>
      <h1 id="petName">宠物档案</h1>
      <span class="subtitle" id="petMeta"></span>
    </div>
    <div class="topbar-right">
      <button class="btn btn-ghost" onclick="history.back()">← 上一页</button>
    </div>
  </header>

  <main class="container detail-container">
    <section class="pet-hero" id="petHero"></section>

    <section class="timeline-section">
      <h2>医疗时间轴</h2>
      <div class="timeline" id="timeline">
        <div class="loading">加载中…</div>
      </div>
    </section>
  </main>

  <div class="modal-mask" id="editModal">
    <div class="modal">
      <h3>编辑基础档案</h3>
      <form id="editForm" class="add-form">
        <label>姓名<input name="name" required placeholder="例如：咪咪"/></label>
        <label>品种<input name="species" required placeholder="例如：猫咪"/></label>
        <label>毛色/详细品种<input name="breed" placeholder="例如：橘猫"/></label>
        <label>年龄<input type="number" name="age" min="0" placeholder="岁"/></label>
        <label>体重(kg)<input type="number" step="0.1" name="weight" placeholder="kg"/></label>
        <label>体温(℃)<input type="number" step="0.1" name="temperature" placeholder="例如 38.5"/></label>
        <label>心率(次/分)<input type="number" name="heart_rate" placeholder="例如 120"/></label>
        <label>下次驱虫日期<input type="date" name="next_deworming"/></label>
        <label>下次狂犬疫苗日期<input type="date" name="next_rabies"/></label>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="cancelEdit">取消</button>
          <button type="submit" class="btn btn-primary">保存修改</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/detail.js"></script>
</body>
</html>
