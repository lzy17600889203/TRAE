<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>懒厨师 · 菜谱收藏夹</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #fff5e6 0%, #ffe9cc 50%, #ffd4a3 100%);
      color: #3d2914;
      min-height: 100vh;
      padding-bottom: 60px;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 24px; }
    h1 { text-align: center; color: #5c3a1f; letter-spacing: 2px; margin-bottom: 6px; }
    .subtitle { text-align: center; color: #8a6d54; margin-top: 0; margin-bottom: 24px; }
    .scene-bar {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px;
    }
    .scene-btn {
      padding: 10px 18px; border: 2px solid transparent; border-radius: 999px;
      background: #fff; color: #5c3a1f; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 14px rgba(139,69,19,0.1);
      transition: transform 0.15s ease, background 0.15s ease;
      font-size: 14px;
    }
    .scene-btn:hover { transform: translateY(-2px); }
    .scene-btn.active {
      background: linear-gradient(135deg, #ff922b, #ffa94d); color: #fff;
      box-shadow: 0 6px 20px rgba(255,146,43,0.4);
    }
    .tip-bar { text-align: center; color: #8a6d54; margin-bottom: 24px; font-size: 14px; }
    .recipe-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px;
      margin-bottom: 28px;
    }
    .recipe-card {
      display: flex; align-items: center; gap: 14px; padding: 16px; background: #fff;
      border-radius: 16px; box-shadow: 0 4px 14px rgba(139,69,19,0.08);
      cursor: pointer; border: 2px solid transparent;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      opacity: 0; transform: perspective(1200px) rotateY(-100deg);
      animation: flipIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    @keyframes flipIn { to { opacity: 1; transform: perspective(1200px) rotateY(0deg); } }
    .recipe-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(139,69,19,0.16); border-color: #ffd8a8; }
    .card-emoji {
      font-size: 36px; width: 56px; height: 56px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #fff4e6, #ffe8cc); border-radius: 50%;
    }
    .card-body { flex: 1; min-width: 0; }
    .card-title { font-weight: 700; color: #5c3a1f; font-size: 16px; }
    .card-desc { color: #8a6d54; font-size: 13px; margin: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 12px; color: #b38961; }
    .loading, .empty { grid-column: 1/-1; text-align: center; padding: 36px; color: #8a6d54; background: #fff; border-radius: 16px; }
    .detail-panel {
      background: #fff; border-radius: 20px; padding: 26px;
      box-shadow: 0 10px 30px rgba(139,69,19,0.12);
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .detail-header { display: flex; gap: 16px; align-items: center; margin-bottom: 20px; padding-bottom: 18px; border-bottom: 2px dashed #ffd8a8; }
    .detail-emoji {
      font-size: 56px; width: 80px; height: 80px;
      background: linear-gradient(135deg, #fff4e6, #ffe8cc); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .detail-header h2 { margin: 0 0 4px; color: #5c3a1f; }
    .servings-box {
      background: linear-gradient(135deg, #fff4e6, #ffe8cc);
      padding: 16px 18px; border-radius: 14px; margin-bottom: 22px;
    }
    .servings-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .servings-slider { flex: 1; min-width: 180px; accent-color: #ff922b; }
    .servings-badge {
      background: #ff922b; color: #fff; padding: 5px 14px; border-radius: 999px;
      font-weight: 700; min-width: 60px; text-align: center;
    }
    .ratio-info { margin-top: 8px; color: #8a6d54; font-size: 13px; }
    h3 { color: #5c3a1f; margin: 0 0 12px; }
    .ingredients-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px;
    }
    .ing-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: #fffaf0; border-radius: 10px; border-left: 4px solid #ffa94d;
    }
    .ing-item.fuzzy { background: #fff9db; border-left-color: #ffd43b; }
    .ing-name { font-weight: 600; color: #5c3a1f; font-size: 14px; }
    .ing-amount { display: inline-flex; align-items: baseline; gap: 4px; font-weight: 700; color: #e8590c; }
    .qty-num {
      font-size: 18px; font-variant-numeric: tabular-nums;
      transition: transform 0.45s cubic-bezier(0.34,1.56,0.64,1);
      display: inline-block;
    }
    .qty-num.rolling { animation: rollNumber 0.55s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes rollNumber {
      0% { transform: translateY(-14px) scale(0.85); opacity: 0; }
      60% { transform: translateY(3px) scale(1.15); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .qty-unit { font-size: 13px; color: #8a6d54; font-weight: 500; }
    .fuzzy-tag { font-size: 14px; }
    .steps-box { margin-top: 24px; }
    .steps-text {
      color: #5c3a1f; line-height: 1.8; background: #fffaf0;
      padding: 14px 16px; border-radius: 10px; font-size: 14px;
    }
    .footer { text-align: center; margin-top: 36px; color: #b38961; font-size: 12px; }

    .add-bar { display: flex; justify-content: center; margin-bottom: 18px; }
    .add-btn {
      padding: 12px 24px; border: 2px dashed #ff922b; border-radius: 14px;
      background: #fff; color: #ff922b; font-size: 15px; font-weight: 700; cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .add-btn:hover { transform: translateY(-2px); background: #fff4e6; }

    .form-panel {
      background: #fff; border-radius: 20px; padding: 26px;
      box-shadow: 0 10px 30px rgba(139,69,19,0.12);
      margin-bottom: 24px;
      animation: fadeIn 0.35s ease;
    }
    .form-panel h2 { color: #5c3a1f; margin: 0 0 18px; font-size: 20px; }
    .form-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
    .form-field { flex: 1; min-width: 180px; }
    .form-field label { display: block; color: #5c3a1f; font-weight: 600; margin-bottom: 4px; font-size: 13px; }
    .form-field input, .form-field select, .form-field textarea {
      width: 100%; padding: 9px 12px; border: 2px solid #ffd8a8; border-radius: 10px;
      font-size: 14px; background: #fffaf0; color: #3d2914; font-family: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
      outline: none; border-color: #ff922b; box-shadow: 0 0 0 3px rgba(255,146,43,0.15);
    }
    .form-field textarea { min-height: 54px; resize: vertical; }

    .ingredients-section { margin-top: 14px; }
    .ingredient-row {
      display: flex; align-items: center; gap: 8px; padding: 10px;
      background: #fffaf0; border-radius: 10px; margin-bottom: 8px;
      border-left: 4px solid #ffa94d;
    }
    .ingredient-row.fuzzy { border-left-color: #ffd43b; background: #fff9db; }
    .ingredient-row input[type="text"], .ingredient-row input[type="number"] {
      padding: 7px 10px; border: 1.5px solid #ffd8a8; border-radius: 8px;
      background: #fff; font-size: 13px; font-family: inherit;
    }
    .ingredient-row input:focus { outline: none; border-color: #ff922b; }
    .ing-name-input { flex: 1.2; min-width: 110px; }
    .ing-qty-input { width: 80px; }
    .ing-unit-input { width: 70px; }
    .ing-fuzzy-input { flex: 1; min-width: 120px; }
    .ing-fuzzy-toggle {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 10px; background: #ffd8a8; color: #5c3a1f; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
      border: none; transition: background 0.15s ease;
    }
    .ing-fuzzy-toggle:hover { background: #ffc078; }
    .ing-fuzzy-toggle.active { background: #ffd43b; }
    .ing-delete-btn {
      background: transparent; border: none; color: #e8590c;
      font-size: 18px; cursor: pointer; padding: 4px 8px;
    }
    .ing-delete-btn:hover { color: #c92a2a; }

    .add-ingredient-btn {
      width: 100%; padding: 10px; border: 2px dashed #ffd8a8; border-radius: 10px;
      background: #fffaf0; color: #e8590c; font-weight: 600; cursor: pointer;
      font-size: 14px; margin-top: 6px;
    }
    .add-ingredient-btn:hover { background: #ffe8cc; border-color: #ff922b; }

    .form-actions {
      display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;
    }
    .btn {
      padding: 10px 22px; border-radius: 10px; border: none;
      font-size: 14px; font-weight: 700; cursor: pointer; transition: transform 0.12s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: linear-gradient(135deg, #ff922b, #ffa94d); color: #fff; box-shadow: 0 4px 12px rgba(255,146,43,0.35); }
    .btn-secondary { background: #fff4e6; color: #5c3a1f; border: 1.5px solid #ffd8a8; }

    .form-error { color: #c92a2a; background: #ffe3e3; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
    .form-success { color: #2f9e44; background: #d3f9d8; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍳 懒厨师的菜谱收藏夹</h1>
    <p class="subtitle">别再纠结"多少克盐"了，记下来下次照着来就行</p>

    <div class="scene-bar" id="sceneBar"></div>
    <div class="add-bar">
      <button class="add-btn" id="addBtn" onclick="openAddForm()">➕ 新增一道菜谱（比如：炖猪蹄）</button>
    </div>
    <div class="tip-bar" id="tipBar">👆 选择一个场景开始吧</div>

    <div id="formContainer"></div>
    <div class="recipe-grid" id="recipeGrid"></div>
    <div id="detailContainer"></div>
    <div class="footer">数据存储：backend/recipes.db · 分量换算由后端完成</div>
  </div>

<script>
  const API = 'http://localhost:3000/api';
  const SCENES = [
    { key: 'bachelor', label: '🧑‍🍳 单身汉一人食', defaultServings: 1, tip: '一个人也要好好吃饭' },
    { key: 'couple',   label: '👩‍❤️‍👨 周末情侣双人餐', defaultServings: 2, tip: '烛光晚餐预定中' },
    { key: 'team',     label: '🎉 公司团建十人饭', defaultServings: 10, tip: '大锅饭，硬菜必须上' },
    { key: 'fail',     label: '💥 调料放错的翻车现场', defaultServings: 2, tip: '前车之鉴，请引以为戒' },
  ];

  let currentScene = null;
  let selectedRecipeId = null;
  let currentServings = 1;

  function buildSceneBar() {
    const bar = document.getElementById('sceneBar');
    bar.innerHTML = '';
    SCENES.forEach((s) => {
      const btn = document.createElement('button');
      btn.className = 'scene-btn' + (currentScene === s.key ? ' active' : '');
      btn.textContent = s.label;
      btn.onclick = () => selectScene(s.key);
      bar.appendChild(btn);
    });
  }

  function setTip(text) {
    document.getElementById('tipBar').textContent = '💡 ' + text;
  }

  async function selectScene(key) {
    currentScene = key;
    selectedRecipeId = null;
    const conf = SCENES.find((s) => s.key === key);
    currentServings = conf.defaultServings;
    buildSceneBar();
    setTip(conf.tip);
    document.getElementById('detailContainer').innerHTML = '';
    const grid = document.getElementById('recipeGrid');
    grid.innerHTML = '<div class="loading">⏳ 正在翻菜谱……</div>';
    try {
      const res = await fetch(API + '/recipes?scene=' + encodeURIComponent(key));
      const recipes = await res.json();
      renderRecipes(recipes);
    } catch (e) {
      grid.innerHTML = '<div class="loading">⛔ 无法连接后端，请确认 node server.js 已在 http://localhost:3000 启动</div>';
    }
  }

  function renderRecipes(recipes) {
    const grid = document.getElementById('recipeGrid');
    if (!recipes || recipes.length === 0) {
      grid.innerHTML = '<div class="empty">📭 这个场景暂时没有菜谱</div>';
      return;
    }
    grid.innerHTML = '';
    recipes.forEach((r, idx) => {
      const card = document.createElement('div');
      card.className = 'recipe-card';
      card.style.animationDelay = (idx * 70) + 'ms';
      card.innerHTML = `
        <div class="card-emoji">${r.emoji || '🍽️'}</div>
        <div class="card-body">
          <div class="card-title">${r.name}</div>
          <div class="card-desc">${r.description || ''}</div>
          <div class="card-meta">基础分量 · ${r.base_servings} 人份</div>
        </div>
      `;
      card.onclick = () => pickRecipe(r.id);
      grid.appendChild(card);
    });
  }

  async function pickRecipe(id) {
    selectedRecipeId = id;
    const container = document.getElementById('detailContainer');
    container.innerHTML = '<div class="detail-panel"><div class="loading">🥄 正在换算分量……</div></div>';
    await loadDetail();
  }

  async function onServingsChange(val) {
    currentServings = Number(val) || 1;
    document.getElementById('servingsBadge').textContent = currentServings + ' 人';
    if (selectedRecipeId != null) await loadDetail();
  }

  async function loadDetail() {
    try {
      const res = await fetch(API + '/recipes/' + selectedRecipeId + '?servings=' + currentServings);
      const r = await res.json();
      renderDetail(r);
    } catch (e) {
      document.getElementById('detailContainer').innerHTML =
        '<div class="detail-panel"><div class="loading">⛔ 获取菜谱详情失败</div></div>';
    }
  }

  function renderDetail(r) {
    const container = document.getElementById('detailContainer');
    const ingHtml = r.ingredients.map((ing) => {
      const cls = ing.is_fuzzy ? 'fuzzy' : '';
      const amount = ing.is_fuzzy
        ? `<span class="qty-num">${ing.display_quantity}</span>
           <span class="fuzzy-tag" title="此食材无法精确换算">⚠</span>`
        : `<span class="qty-num">${ing.display_quantity}</span>
           <span class="qty-unit">${ing.unit || ''}</span>`;
      return `<div class="ing-item ${cls}">
        <span class="ing-name">${ing.name}</span>
        <span class="ing-amount">${amount}</span>
      </div>`;
    }).join('');

    container.innerHTML = `
      <div class="detail-panel">
        <div class="detail-header">
          <div class="detail-emoji">${r.emoji || '🍽️'}</div>
          <div>
            <h2>${r.name}</h2>
            <p style="color:#8a6d54;margin:0;">${r.description || ''}</p>
          </div>
        </div>
        <div class="servings-box">
          <div class="servings-row">
            <label style="font-weight:700;color:#5c3a1f;">🍽 就餐人数</label>
            <input id="servingsSlider" type="range" min="1" max="20" step="1"
                   value="${currentServings}" class="servings-slider" />
            <div class="servings-badge" id="servingsBadge">${currentServings} 人</div>
          </div>
          <div class="ratio-info">
            基准 ${r.base_servings} 人份 → 当前 ${r.target_servings} 人份 ·
            换算系数 × ${Number(r.ratio).toFixed(2)}
          </div>
        </div>
        <h3>🥕 食材清单</h3>
        <div class="ingredients-list">${ingHtml}</div>
        ${r.steps ? `
          <div class="steps-box">
            <h3>📖 步骤</h3>
            <p class="steps-text">${r.steps}</p>
          </div>
        ` : ''}
      </div>
    `;

    const slider = document.getElementById('servingsSlider');
    slider.oninput = (e) => onServingsChange(e.target.value);

    // 触发滚动动画
    setTimeout(() => {
      document.querySelectorAll('.qty-num').forEach((el) => {
        el.classList.remove('rolling');
        void el.offsetWidth;
        el.classList.add('rolling');
      });
    }, 30);
  }

  // ======= 新增菜谱功能 =======
  const DEFAULT_UNITS = ['g', 'ml', '个', '只', '勺', '片', '瓣', '根', '颗', '把'];
  const FUZZY_PRESETS = ['少许', '适量', '一点', '几滴', '随手一把', '凭感觉'];

  function openAddForm() {
    selectedRecipeId = null;
    document.getElementById('detailContainer').innerHTML = '';
    const container = document.getElementById('formContainer');
    const sceneKey = currentScene || 'bachelor';
    container.innerHTML = `
      <div class="form-panel">
        <h2>➕ 新增菜谱</h2>
        <div id="formMsg"></div>
        <div class="form-row">
          <div class="form-field">
            <label>菜名 <span style="color:#e8590c;">*</span></label>
            <input id="f-name" type="text" placeholder="例如：红烧炖猪蹄" />
          </div>
          <div class="form-field">
            <label>表情图标（可不填）</label>
            <input id="f-emoji" type="text" placeholder="🍖 留空也行" value="🍳" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label>所属场景 <span style="color:#e8590c;">*</span></label>
            <select id="f-scene">
              ${SCENES.map((s) => `<option value="${s.key}" ${s.key === sceneKey ? 'selected' : ''}>${s.label}</option>`).join('')}
            </select>
          </div>
          <div class="form-field">
            <label>基础人数（以下食材按多少人份记录的）</label>
            <input id="f-servings" type="number" min="1" step="1" value="1" style="width:100%;" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field" style="flex:1;">
            <label>小提示（可不填）</label>
            <input id="f-desc" type="text" placeholder="简单描述一下这道菜" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-field" style="flex:1;">
            <label>做法步骤（可不填）</label>
            <textarea id="f-steps" placeholder="1. ... 2. ..."></textarea>
          </div>
        </div>

        <div class="ingredients-section">
          <h3>🥕 食材列表（必填至少一种）</h3>
          <div id="ingredientsList"></div>
          <button class="add-ingredient-btn" onclick="addIngredientRow()">➕ 再加一行食材</button>
        </div>

        <div class="form-actions">
          <button class="btn btn-secondary" onclick="closeAddForm()">取消</button>
          <button class="btn btn-primary" onclick="submitAddRecipe()">💾 保存菜谱</button>
        </div>
      </div>
    `;
    // 初始化 3 行空食材行
    for (let i = 0; i < 3; i++) addIngredientRow();
    // 滚到表单
    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function closeAddForm() {
    document.getElementById('formContainer').innerHTML = '';
  }

  function addIngredientRow() {
    const list = document.getElementById('ingredientsList');
    if (!list) return;
    const row = document.createElement('div');
    row.className = 'ingredient-row';
    row.innerHTML = `
      <input class="ing-name-input" type="text" placeholder="食材名（如：猪蹄）" />
      <span style="color:#8a6d54;white-space:nowrap;font-size:13px;">→</span>
      <button class="ing-fuzzy-toggle" onclick="toggleFuzzy(this)" type="button">🌓 切换为"少许"</button>
      <input class="ing-qty-input" type="number" min="0" step="any" placeholder="数量" />
      <input class="ing-unit-input" list="unitList" type="text" placeholder="单位" />
      <input class="ing-fuzzy-input" type="text" placeholder="如：少许/适量/几滴" style="display:none;" />
      <button class="ing-delete-btn" onclick="this.parentElement.remove()" type="button" title="删除此行">✕</button>
    `;
    list.appendChild(row);
    // 第一次加：确保有 datalist
    ensureUnitDatalist();
  }

  function ensureUnitDatalist() {
    if (!document.getElementById('unitList')) {
      const dl = document.createElement('datalist');
      dl.id = 'unitList';
      dl.innerHTML = DEFAULT_UNITS.map((u) => `<option value="${u}">`).join('');
      document.body.appendChild(dl);
    }
  }

  function toggleFuzzy(btn) {
    const row = btn.parentElement;
    const isFuzzy = row.classList.toggle('fuzzy');
    const qtyInput = row.querySelector('.ing-qty-input');
    const unitInput = row.querySelector('.ing-unit-input');
    const fuzzyInput = row.querySelector('.ing-fuzzy-input');
    if (isFuzzy) {
      btn.textContent = '🌓 切换为"数值"';
      btn.classList.add('active');
      qtyInput.style.display = 'none';
      unitInput.style.display = 'none';
      fuzzyInput.style.display = 'inline-block';
      // 默认给个模糊占位
      if (!fuzzyInput.value) fuzzyInput.value = '少许';
    } else {
      btn.textContent = '🌓 切换为"少许"';
      btn.classList.remove('active');
      qtyInput.style.display = 'inline-block';
      unitInput.style.display = 'inline-block';
      fuzzyInput.style.display = 'none';
    }
  }

  function showFormMsg(type, text) {
    const box = document.getElementById('formMsg');
    if (!box) return;
    box.innerHTML = `<div class="form-${type}">${text}</div>`;
  }

  async function submitAddRecipe() {
    const name = document.getElementById('f-name').value.trim();
    const emoji = document.getElementById('f-emoji').value.trim() || '🍽️';
    const scene = document.getElementById('f-scene').value;
    const servings = Math.max(1, parseInt(document.getElementById('f-servings').value, 10) || 1);
    const desc = document.getElementById('f-desc').value.trim();
    const steps = document.getElementById('f-steps').value.trim();

    if (!name) { showFormMsg('error', '菜名不能空，至少几个字～'); return; }

    // 收集食材
    const rows = document.querySelectorAll('#ingredientsList .ingredient-row');
    const ingredients = [];
    for (const row of rows) {
      const ingName = row.querySelector('.ing-name-input').value.trim();
      if (!ingName) continue; // 空行忽略
      const isFuzzy = row.classList.contains('fuzzy');
      if (isFuzzy) {
        const label = row.querySelector('.ing-fuzzy-input').value.trim() || '适量';
        ingredients.push({ name: ingName, base_quantity: null, unit: '', is_fuzzy: true, fuzzy_label: label });
      } else {
        const qty = row.querySelector('.ing-qty-input').value;
        const unit = row.querySelector('.ing-unit-input').value.trim();
        if (qty === '' || isNaN(Number(qty))) {
          showFormMsg('error', `食材 "${ingName}" 的数量不合法，请填数字或切换为"少许"模式`);
          return;
        }
        ingredients.push({ name: ingName, base_quantity: Number(qty), unit: unit || '', is_fuzzy: false, fuzzy_label: '' });
      }
    }
    if (ingredients.length === 0) {
      showFormMsg('error', '至少要记录一种食材/调料～');
      return;
    }

    const body = {
      name, emoji, scene, base_servings: servings, description: desc, steps, ingredients,
    };

    const oldBtn = document.querySelector('.form-actions .btn-primary');
    if (oldBtn) { oldBtn.disabled = true; oldBtn.textContent = '⏳ 保存中...'; }
    showFormMsg('success', '正在写入数据库...');

    try {
      const res = await fetch(API + '/recipes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error('后端返回失败：' + res.status);
      const data = await res.json();
      showFormMsg('success', `✅ 已保存「${name}」(id=${data.id})，正在刷新列表...`);
      closeAddForm();
      // 刷新当前场景的列表（切换到新菜谱所属场景）
      if (scene !== currentScene) {
        currentScene = scene;
        const conf = SCENES.find((s) => s.key === scene);
        currentServings = conf.defaultServings;
        buildSceneBar();
        setTip(conf.tip);
      }
      // 重新拉列表
      const listRes = await fetch(API + '/recipes?scene=' + encodeURIComponent(scene));
      const recipes = await listRes.json();
      renderRecipes(recipes);
      // 高亮新菜谱
      setTimeout(() => {
        const cards = document.querySelectorAll('.recipe-card');
        if (cards.length) {
          const lastCard = cards[cards.length - 1];
          lastCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
          lastCard.style.boxShadow = '0 0 0 3px #ff922b, 0 10px 24px rgba(139,69,19,0.16)';
          setTimeout(() => { lastCard.style.boxShadow = ''; }, 2500);
        }
      }, 100);
    } catch (e) {
      showFormMsg('error', '保存失败：' + e.message);
      if (oldBtn) { oldBtn.disabled = false; oldBtn.textContent = '💾 保存菜谱'; }
    }
  }

  // 初始化：默认第一个场景
  buildSceneBar();
  selectScene('bachelor');
</script>
</body>
</html>
